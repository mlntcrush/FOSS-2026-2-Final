# [1단계] gitleaks: 비밀키 유출 검사
# 사용법: 이 파일 내용을 .github/workflows/security.yml 에 붙여 넣고 push
#
# 왜 gitleaks-action이 아니라 본체(CLI)를 직접 받나?
#  - gitleaks 본체는 MIT 라이선스(오픈소스)
#  - gitleaks-action은 v2.0.0부터 MIT가 아닌 자체 라이선스로 바뀌었다
#  - 받은 파일은 SHA256 체크섬으로 검증해서 "바꿔치기된 파일"을 실행하지 않는다
name: security

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 커밋 기록 전체를 받아야 과거 커밋 속 키까지 검사할 수 있다

      - name: Install gitleaks v8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan secrets in full git history
        run: ./gitleaks git . --verbose --redact
