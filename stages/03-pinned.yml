# [3단계 = 최종본] 모든 Action을 커밋 SHA로 고정 + 최소 권한
# 사용법: 이 파일 내용을 .github/workflows/security.yml 에 붙여 넣고 push
#
# 왜 SHA로 고정하나?
#  2026-03-19 공격자가 aquasecurity/trivy-action의 버전 태그 77개 중 76개를
#  악성 커밋으로 강제 이동시켰다 (GHSA-69fq-xp46-6x23, CVE-2026-33634).
#  "@v0.x" 같은 태그는 언제든 다른 코드를 가리킬 수 있지만,
#  40자리 커밋 SHA는 바꿀 수 없다.
#
# SHA 출처 (2026-11-24 조회, gh api repos/<owner>/<repo>/commits/<tag>):
#  actions/checkout v7.0.1          -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#  aquasecurity/trivy-action v0.36.0 -> ed142fd0673e97e23eac54620cfb913e5ce36c25 (immutable release)
#  actions/upload-artifact v7.0.2   -> cf430e030ddbb5b0abf93d22962f4752f3646cd9
name: security

on:
  push:
  pull_request:

# 최소 권한: 이 워크플로는 코드를 읽기만 한다
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # 토큰을 디스크에 남기지 않는다
      - name: Install gitleaks v8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan secrets in full git history
        run: ./gitleaks git . --verbose --redact

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
